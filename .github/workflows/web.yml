name: Versión web (GitHub Pages)

# Publica la app en https://<usuario>.github.io/JuegosConAmigos/ para que los amigos
# sin la APK puedan jugar desde el navegador con el enlace de invitación.
# Requiere activar una vez: Settings → Pages → Source: "GitHub Actions".

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test && npm run vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
