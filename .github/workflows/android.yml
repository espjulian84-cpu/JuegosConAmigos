name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de los juegos
        run: npm test

      - name: Preparar proyecto Android
        run: |
          npm run vendor
          VER=1.0.${{ github.run_number }}
          echo "export const VERSION = '$VER';" > www/js/version.js
          # todo el código en un único archivo con la versión en el nombre:
          # así el móvil nunca puede usar archivos guardados de una versión anterior
          npx --yes esbuild@0.24.2 www/js/app.js --bundle --format=esm --outfile=www/app-$VER.js --log-level=warning
          sed -i "s#js/app.js#app-$VER.js#; s#css/style.css#css/style.css?v=$VER#" www/index.html
          grep -q "app-$VER.js" www/index.html
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android --assetPath assets
          # permiso de vibración (avisos de turno)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml
          # versión = número de compilación (permite actualizar la app instalada)
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
          # firma fija para que cada APK nuevo actualice al anterior sin desinstalar
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
          # y además se indica a Gradle explícitamente (si no, a veces genera una clave nueva en cada compilación)
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file('../keystore/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.debug } }
          }
          GRADLE

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          # comprobar que la APK lleva la firma fija (si no, el móvil no deja actualizar)
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee firma.txt
          grep -qi "bff2c8788d0be25281df3dd26fe0f889207b00ba6d73719df2dc59cf67ce7d99" firma.txt
          cp android/app/build/outputs/apk/debug/app-debug.apk JuegosConAmigos.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk JuegosConAmigos-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JuegosConAmigos-apk
          path: JuegosConAmigos-1.0.${{ github.run_number }}.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Juegos con Amigos 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            JuegosConAmigos-1.0.${{ github.run_number }}.apk
            JuegosConAmigos.apk
          body: |
            📲 Descarga **JuegosConAmigos-1.0.${{ github.run_number }}.apk** desde el móvil e instálala (permite "instalar apps de origen desconocido" si te lo pide).
            En la pantalla de inicio de la app debe poner "Versión 1.0.${{ github.run_number }}".
            Rama: ${{ github.ref_name }} · Commit: ${{ github.sha }}
